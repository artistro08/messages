name: Release

# A merge to main with a new version in src/Directory.Build.props builds the signed Release (Native AOT) MSI for x64
# and ARM64 and publishes a GitHub release with them. A version that already has its tag (v1.0.0 for 1.0.0) is
# skipped, so merges that don't bump the version make no release. The app's updater reads the latest release and
# downloads the MSI named Messages-<version>-<arch>.msi, checking it against the SHA-256 digest GitHub keeps for each
# asset, so keep those names. The notes are the install steps, then every commit since the previous version tag
# (merges and version bumps left out). The signing certificate lives only in the repository secrets (SIGNING_PFX,
# base64; SIGNING_PASSWORD). Run by hand (Actions > Release > Run workflow), it only builds and keeps the installers
# as a run artifact: a test of the build, never a release.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      # Full History (the notes need the previous version tag and the commits since it)
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Version Check: a merge publishes only a version without its tag yet; a run by hand always builds, never
      # publishes
      - name: Check the version
        id: version
        shell: pwsh
        run: |
          $props   = [xml](Get-Content src/Directory.Build.props -Raw)
          $version = ($props.Project.PropertyGroup.Version | Where-Object { $_ }) | Select-Object -First 1
          $tag     = "v$version"
          git rev-parse -q --verify "refs/tags/$tag" | Out-Null
          $publish = $LASTEXITCODE -ne 0 -and $env:GITHUB_EVENT_NAME -eq 'push'
          $build   = $publish -or $env:GITHUB_EVENT_NAME -eq 'workflow_dispatch'
          "VERSION=$version" >> $env:GITHUB_ENV
          "TAG=$tag" >> $env:GITHUB_ENV
          "build=$($build.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          "publish=$($publish.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          if (-not $build) { "$tag is released already; skipping." }
          exit 0

      - uses: actions/setup-dotnet@v5
        if: steps.version.outputs.build == 'true'
        with:
          dotnet-version: '10.0.x'

      # Signing Certificate: from the repository secrets into this runner's store, where Build-Installer.ps1 finds it
      - name: Import the signing certificate
        if: steps.version.outputs.build == 'true'
        shell: pwsh
        env:
          SIGNING_PFX: ${{ secrets.SIGNING_PFX }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'signing.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGNING_PFX))
          $password = ConvertTo-SecureString $env:SIGNING_PASSWORD -AsPlainText -Force
          Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password | Out-Null
          Remove-Item $pfx

      # Signed MSIs: restore first, so SignTool (from the Windows SDK build tools package) and the prerequisite
      # packages are on disk for the script
      - name: Build the signed MSIs
        if: steps.version.outputs.build == 'true'
        shell: pwsh
        run: |
          dotnet restore src/GMessages.App/GMessages.App.csproj -p:Platform=x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/Build-Installer.ps1

      # Test Build: a run by hand keeps the installers for a week instead of releasing them
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: messages-${{ env.VERSION }}
          path: artifacts/Messages-*.msi
          retention-days: 7

      # Notes: the install steps, then every commit since the previous version tag (the whole history for the first
      # one), merges and version bumps left out
      - name: Write the notes
        if: steps.version.outputs.publish == 'true'
        shell: pwsh
        run: |
          $previous = git describe --tags --abbrev=0 --match 'v*' HEAD 2>$null
          $range    = if ($LASTEXITCODE -eq 0) { "$previous..HEAD" } else { 'HEAD' }
          $changes  = git log $range --no-merges --format='- %s' | Where-Object { $_ -notmatch '^- chore(\(release\))?: version' }
          $notes = @(
              '### Install'
              '1. Download the `.msi` for your PC (`x64` for most PCs, `arm64` for Snapdragon) and open it. It installs into Program Files, so Windows asks for admin permission.'
              '2. If Windows SmartScreen warns about it, choose **More info > Run anyway** (the app is self-signed).'
              ''
              'Already on Messages 1.0.0 or later? The app updates itself from Settings > Updates.'
              ''
              '### Changes'
              $changes
          )
          Set-Content -Path notes.md -Value $notes -Encoding utf8

      # Release: both installers, published as the latest
      - name: Publish the release
        if: steps.version.outputs.publish == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:TAG --latest --target $env:GITHUB_SHA --title "Messages $env:VERSION" --notes-file notes.md `
              "artifacts/Messages-$($env:VERSION)-x64.msi" "artifacts/Messages-$($env:VERSION)-arm64.msi"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
